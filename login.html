<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login Google Modern</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            width: 320px;
            transition: all 0.3s ease;
        }
        .logo-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        h2 {
            margin: 0 0 10px 0;
            color: #1e293b;
            font-size: 24px;
        }
        p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }
        /* Style untuk halaman Dashboard setelah sukses login */
        .profile-card {
            display: none;
        }
        .user-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 3px solid #22c55e;
        }
        .user-name {
            font-size: 20px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 5px;
        }
        .user-email {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 25px;
        }
        .btn-logout {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="card" id="loginBox">
        <div class="logo-container">
            <img src="https://fikrinurijanm.github.io/loginku/login.html.docx" onerror="this.src='https://cdn-icons-png.flaticon.com/512/300/300221.png'" alt="Logo">
        </div>
        <h2>Selamat Datang</h2>
        <p>Silakan masuk menggunakan akun Google Anda untuk melanjutkan.</p>
        
        <div id="g_id_onload"
             data-client_id="428118169003-p2r5lb837chfl116oi2tc9pkjci7lbvl.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>

        <div class="g_id_signin"
             data-type="standard"
             data-shape="pill"
             data-theme="filled_blue"
             data-text="signin_with"
             data-size="large"
             data-logo_alignment="left">
      </div>
</div>

<div class="card profile-card" id="profileBox" style="background-color: #ffffff !important; color: #1a1a1a !important; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <div class="logo-container" style="width:70px; height:70px; margin-bottom:10px;">
        <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" alt="Logo">
    </div>
    
    <h3 style="margin-top:0; color: #22c55e !important; font-weight: bold; font-size: 20px;">Autentikasi Berhasil!</h3>
    
    <img id="avatar" class="user-avatar" src="" alt="Foto Profil" style="border-radius: 50%; width: 60px; height: 60px; margin-bottom: 10px;">
    
    <div style="margin-bottom: 8px;">
        <span style="font-weight: bold; color: #555555 !important;">Nama Lengkap:</span>
        <div id="name" class="user-name" style="color: #1a1a1a !important; font-size: 16px; font-weight: 500;">Nama Pengguna</div>
    </div>
    
    <div style="margin-bottom: 20px;">
        <span style="font-weight: bold; color: #555555 !important;">Alamat Email:</span>
        <div id="email" class="user-email" style="color: #1a1a1a !important; font-size: 14px;">email@gmail.com</div>
    </div>
    
    <button class="btn-logout" onclick="logout()" style="background-color: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">Keluar / Logout</button>
</div>

    <script>
        // Fungsi membaca data rahasia dari Google (JWT Token)
        function decodeJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // Jalankan fungsi ini saat login sukses
        function handleCredentialResponse(response) {
            // Membongkar data pengguna dari Google
            const userData = decodeJwt(response.credential);
            
            // Masukkan data Google ke halaman dashboard
            document.getElementById("name").innerText = userData.name;
            document.getElementById("email").innerText = userData.email;
            document.getElementById("avatar").src = userData.picture;
            
            // Sembunyikan kotak login, lalu munculkan kotak profil
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("profileBox").style.display = "block";
        }

        // Fungsi Tombol Keluar
        function logout() {
            // Segarkan halaman untuk kembali ke menu login awal
            window.location.reload();
        }
    </script>

</body>
</html>
